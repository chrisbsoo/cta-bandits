[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacb"
version = "0.1.0"
description = "Time-Attention Contesting Bandits: oracle, policies and experiment runner"
requires-python = ">=3.10"
dependencies = ["numpy", "numba", "scipy", "pandas", "matplotlib"]

[project.optional-dependencies]
modal = ["modal"]
dev = ["pytest"]

[project.scripts]
tacb = "tacb.cli:main"

[tool.setuptools.packages.find]
include = ["tacb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
